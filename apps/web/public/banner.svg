<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single&amp;display=swap');
      
      .bg { fill: #050814; }
      
      .title {
        font-family: 'Bitcount Prop Single', sans-serif;
        font-size: 90px;
        fill: #ffffff;
        text-anchor: middle;
        animation: glitch 3s infinite;
      }
      
      .title-glow {
        font-family: 'Bitcount Prop Single', sans-serif;
        font-size: 90px;
        fill: transparent;
        stroke: #e63946;
        stroke-width: 2px;
        text-anchor: middle;
        animation: pulse 2s ease-in-out infinite alternate;
      }

      .subtitle {
        font-family: monospace;
        font-size: 18px;
        fill: #a8dadc;
        text-anchor: middle;
        letter-spacing: 6px;
        animation: type 4s steps(40, end) infinite alternate;
        white-space: nowrap;
        overflow: hidden;
      }

      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }

      @keyframes pulse {
        0% { filter: drop-shadow(0 0 10px #e63946); transform: scale(1); }
        100% { filter: drop-shadow(0 0 25px #457b9d); transform: scale(1.02); }
      }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      .floating-group {
        animation: float 6s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" class="bg" rx="20" ry="20" />
  
  <!-- Subtle grid background -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="20" ry="20" />
  
  <g class="floating-group">
    <!-- Glowing outline behind -->
    <text x="400" y="130" class="title-glow">VerseCV</text>
    <!-- Main text -->
    <text x="400" y="130" class="title">VerseCV</text>
    
    <text x="400" y="180" class="subtitle">&lt; YOUR CAREER ACROSS ALTERNATE REALITIES /&gt;</text>
  </g>
</svg>
